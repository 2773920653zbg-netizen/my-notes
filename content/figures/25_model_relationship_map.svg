   <g id="text_10">
    <text style="font-size: 10.2px; font-family: 'Noto Sans CJK JP'; text-anchor: middle; fill: #23415c" x="369.9" y="337.527469" transform="rotate(-0 369.9 337.527469)">每一步的改进都围绕一个瓶颈：稀疏表示 → 计算规模 → 顺序依赖 → 长期梯度 → 固定长度瓶颈 → 对齐选择。</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'Noto Sans CJK JP'; text-anchor: middle; fill: #23313f" x="369.9" y="389.271469" transform="rotate(-0 369.9 389.271469)">理解“为什么需要下一个模型”，比孤立背诵模型名称更重要。</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 17px; font-family: 'Noto Sans CJK JP'; text-anchor: middle; fill: #23313f" x="369.9" y="20.765469" transform="rotate(-0 369.9 20.765469)">模型关系总图：本书的技术如何一步步解决前一个问题</text>
   </g>
