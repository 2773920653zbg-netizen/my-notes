   </g>
   <g id="text_6">
    <text style="font-size: 10.5px; font-family: 'Noto Sans CJK JP'; text-anchor: middle; fill: #23415c" x="342" y="254.118538" transform="rotate(-0 342 254.118538)">目的：削弱高频词影响，去除负关联项，并保留主要变化方向。</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 10px; font-family: 'Noto Sans CJK JP'; text-anchor: middle; fill: #23313f" x="342" y="294.035338" transform="rotate(-0 342 294.035338)">SVD：X = UΣVᵀ；奇异值越大，对应方向通常越重要。</text>
   </g>
