   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'Noto Sans CJK JP'; fill: #23313f" transform="translate(212.471172 150.931319)">PMI</text>
    <text style="font-size: 11px; font-family: 'Noto Sans CJK JP'; fill: #23313f" transform="translate(161.53 163.957381)">比较联合概率与独立概率</text>
   </g>
   <g id="text_3">
    <text style="font-size: 11px; font-family: 'Noto Sans CJK JP'; fill: #23313f" transform="translate(348.489844 150.931319)">PPMI</text>
    <text style="font-size: 11px; font-family: 'Noto Sans CJK JP'; fill: #23313f" transform="translate(331.512031 163.957381)">max(0, PMI)</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11px; font-family: 'Noto Sans CJK JP'; fill: #23313f" transform="translate(479.646016 150.931319)">SVD</text>
    <text style="font-size: 11px; font-family: 'Noto Sans CJK JP'; fill: #23313f" transform="translate(473.937187 163.957381)">UΣVᵀ</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11px; font-family: 'Noto Sans CJK JP'; fill: #23313f" transform="translate(593.6425 150.931319)">截断 U</text>
