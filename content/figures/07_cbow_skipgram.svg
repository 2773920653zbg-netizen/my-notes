   <g id="text_1">
    <text style="font-size: 12px; font-family: 'Noto Sans CJK JP'; fill: #23313f" transform="translate(154.32 125.085063)">CBOW</text>
    <text style="font-size: 12px; font-family: 'Noto Sans CJK JP'; fill: #23313f" transform="translate(118.4325 139.295313)">上下文词  →  目标词</text>
    <text style="font-size: 12px; font-family: 'Noto Sans CJK JP'; fill: #23313f" transform="translate(106.12125 153.505563)">“周围词共同预测中心词”</text>
   </g>
   <g id="text_2">
    <text style="font-size: 12px; font-family: 'Noto Sans CJK JP'; fill: #23313f" transform="translate(483.204375 124.959438)">Skip-gram</text>
    <text style="font-size: 12px; font-family: 'Noto Sans CJK JP'; fill: #23313f" transform="translate(446.8125 139.420938)">目标词  →  多个上下文词</text>
    <text style="font-size: 12px; font-family: 'Noto Sans CJK JP'; fill: #23313f" transform="translate(458.50125 153.631188)">“中心词预测周围词”</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10px; font-family: 'Noto Sans CJK JP'; fill: #23415c" transform="translate(134.6 196.817188)">通常训练效率较高</text>
    <text style="font-size: 10px; font-family: 'Noto Sans CJK JP'; fill: #23415c" transform="translate(134.6 208.659063)">适合学习常见模式</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'Noto Sans CJK JP'; fill: #23415c" transform="translate(454.4 196.817188)">对上下文各位置分别建模</text>
    <text style="font-size: 10px; font-family: 'Noto Sans CJK JP'; fill: #23415c" transform="translate(464.4 208.659063)">常用于捕捉词语关系</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 10.2px; font-family: 'Noto Sans CJK JP'; text-anchor: middle; fill: #23313f" x="342" y="277.959063" transform="rotate(-0 342 277.959063)">二者都通过上下文预测任务学习词向量；本书强调 CBOW 的实现，随后解释 Skip-gram。</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 17px; font-family: 'Noto Sans CJK JP'; text-anchor: middle; fill: #23313f" x="342" y="21.719063" transform="rotate(-0 342 21.719063)">CBOW 与 Skip-gram：预测方向相反</text>
