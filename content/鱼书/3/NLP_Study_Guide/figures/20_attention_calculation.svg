   <g id="text_1">
    <text style="font-size: 11px; font-family: 'Noto Sans CJK JP'; fill: #23313f" transform="translate(55.03 117.63905)">编码器状态</text>
    <text style="font-size: 11px; font-family: 'Noto Sans CJK JP'; fill: #23313f" transform="translate(50.183984 130.665112)">h1, h2, ..., hn</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'Noto Sans CJK JP'; fill: #23313f" transform="translate(49.53 191.37425)">当前解码状态</text>
    <text style="font-size: 11px; font-family: 'Noto Sans CJK JP'; fill: #23313f" transform="translate(74.042812 204.400312)">h_t</text>
   </g>
   <g id="text_3">
    <text style="font-size: 11px; font-family: 'Noto Sans CJK JP'; fill: #23313f" transform="translate(214.06 149.23985)">相似度打分</text>
    <text style="font-size: 11px; font-family: 'Noto Sans CJK JP'; fill: #23313f" transform="translate(206.918594 162.265912)">s_i = h_t · h_i</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'Noto Sans CJK JP'; fill: #23313f" transform="translate(372.766094 149.548506)">Softmax</text>
    <text style="font-size: 10px; font-family: 'Noto Sans CJK JP'; fill: #23313f" transform="translate(351.515312 161.390381)">a_i = softmax(s_i)</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10px; font-family: 'Noto Sans CJK JP'; fill: #23313f" transform="translate(503.35 149.548506)">加权求和</text>
    <text style="font-size: 10px; font-family: 'Noto Sans CJK JP'; fill: #23313f" transform="translate(498.589063 161.390381)">c = Σa_ih_i</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11px; font-family: 'Noto Sans CJK JP'; fill: #23313f" transform="translate(615.66 149.23985)">上下文</text>
    <text style="font-size: 11px; font-family: 'Noto Sans CJK JP'; fill: #23313f" transform="translate(629.355 162.265912)">c</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10.4px; font-family: 'Noto Sans CJK JP'; text-anchor: middle; fill: #23415c" x="342" y="281.671669" transform="rotate(-0 342 281.671669)">a_i ∈ [0,1]，且 Σi a_i = 1；权重可微，因此能够通过反向传播自动学习对齐。</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 10.2px; font-family: 'Noto Sans CJK JP'; text-anchor: middle; fill: #23313f" x="342" y="323.806069" transform="rotate(-0 342 323.806069)">Attention 不是真的“离散挑选一个词”，而是对所有位置做可微的软选择。</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 17px; font-family: 'Noto Sans CJK JP'; text-anchor: middle; fill: #23313f" x="342" y="20.765469" transform="rotate(-0 342 20.765469)">Attention 的一次计算：相似度 → Softmax → 加权和</text>
   </g>
  </g>
 </g>
