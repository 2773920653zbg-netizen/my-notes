configuration:
  pageTitle: "我的个人笔记"
  baseUrl: "2773920653zbg-netizen.github.io/my-notes"
  enableSPA: true
  enablePopovers: true
  locale: "zh-CN"
  analytics: null

plugins:
  - source: "github:quartz-community/content"
    enabled: true
  - source: "github:quartz-community/explorer"
    enabled: true
    layout:
      position: left
      priority: 50
  - source: "github:quartz-community/search"
    enabled: true
    layout:
      position: header
      priority: 10
  - source: "github:quartz-community/darkmode"
    enabled: true
    layout:
      position: header
      priority: 20
