configuration:
  pageTitle: "我的个人笔记"
  baseUrl: "/my-notes"
  enableSPA: true
  enablePopovers: true
  locale: "zh-CN"
  analytics: null

plugins:
  - source: ./plugins/content
    enabled: true
  - source: ./plugins/explorer
    enabled: true
    layout:
      position: left
      priority: 50
  - source: ./plugins/search
    enabled: true
    layout:
      position: header
      priority: 10
  - source: ./plugins/darkmode
    enabled: true
    layout:
      position: header
      priority: 20
